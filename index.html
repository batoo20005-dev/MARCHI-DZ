<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MARCHI DZ | تسوق بثقة، استلم براحة</title>

<!-- مكتبة Supabase للاتصال بقاعدة البيانات -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f7f9fa;
    color:#172033;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

/* ================= HEADER ================= */

header{
    background:white;
    border-bottom:1px solid #e5e9ec;
    position:sticky;
    top:0;
    z-index:1000;
}

.top-header{
    max-width:1400px;
    margin:auto;
    min-height:82px;
    padding:10px 25px;
    display:flex;
    align-items:center;
    gap:25px;
}

/* LOGO */

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:220px;
}

.logo img{
    width:58px;
    height:58px;
    object-fit:contain;
}

.logo-text{
    display:flex;
    flex-direction:column;
}

.logo-name{
    font-size:25px;
    font-weight:900;
    letter-spacing:1px;
}

.marchi{
    color:#102a43;
}

.dz{
    color:#16a34a;
}

.logo-slogan{
    font-size:11px;
    color:#777;
    margin-top:4px;
}

/* SEARCH */

.search{
    flex:1;
    height:48px;
    display:flex;
    border:1px solid #dfe5e9;
    border-radius:10px;
    overflow:hidden;
}

.search input{
    flex:1;
    border:none;
    outline:none;
    padding:0 18px;
    font-size:15px;
}

.search button{
    width:60px;
    border:none;
    background:#102a43;
    color:white;
    font-size:19px;
}

.search button:hover{
    background:#16a34a;
}

/* HEADER ACTIONS */

.header-actions{
    display:flex;
    gap:22px;
    align-items:center;
}

.header-action{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    cursor:pointer;
    white-space:nowrap;
}

.header-action:hover{
    color:#16a34a;
}

.action-icon{
    font-size:21px;
}

.cart{
    position:relative;
}

.cart-count{
    position:absolute;
    top:-10px;
    right:-10px;
    width:19px;
    height:19px;
    background:#16a34a;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
}

/* ================= NAV ================= */

.navigation{
    background:white;
    border-top:1px solid #f0f2f4;
}

.nav-container{
    max-width:1400px;
    margin:auto;
    min-height:55px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:50px;
}

.nav-item{
    height:55px;
    display:flex;
    align-items:center;
    font-size:15px;
    font-weight:bold;
    position:relative;
    cursor:pointer;
}

.nav-item:hover{
    color:#16a34a;
}

.nav-item.active{
    color:#16a34a;
}

.nav-item.active::after{
    content:"";
    position:absolute;
    bottom:0;
    right:0;
    left:0;
    height:3px;
    background:#16a34a;
}

/* ================= HERO ================= */

.hero{
    max-width:1400px;
    height:430px;
    margin:20px auto 0;
    border-radius:16px;
    overflow:hidden;
    position:relative;
    background:
    linear-gradient(
        90deg,
        rgba(5,15,25,.80),
        rgba(5,15,25,.25),
        rgba(5,15,25,.05)
    ),
    url("https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1800&q=85");
    background-size:cover;
    background-position:center;
}

.hero-content{
    position:absolute;
    right:80px;
    top:50%;
    transform:translateY(-50%);
    color:white;
    max-width:550px;
}

.hero-content h1{
    font-size:48px;
    line-height:1.25;
    margin-bottom:18px;
}

.hero-content p{
    font-size:18px;
    line-height:1.8;
    margin-bottom:28px;
}

.hero-button{
    background:#16a34a;
    color:white;
    border:none;
    border-radius:8px;
    padding:15px 32px;
    font-size:16px;
    font-weight:bold;
}

.hero-button:hover{
    background:#12813b;
}

.slider-dots{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
}

.slider-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:white;
}

.slider-dot.active{
    background:#16a34a;
}

/* ================= FEATURES ================= */

.features{
    max-width:1100px;
    margin:auto;
    background:white;
    border-radius:0 0 15px 15px;
    box-shadow:0 5px 25px rgba(0,0,0,.06);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:22px;
}

.feature{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    border-left:1px solid #e5e9ec;
}

.feature:last-child{
    border-left:none;
}

.feature-icon{
    font-size:30px;
}

.feature-text strong{
    display:block;
    margin-bottom:5px;
}

.feature-text span{
    color:#777;
    font-size:12px;
}

/* ================= MAIN ================= */

.container{
    max-width:1400px;
    margin:auto;
    padding:50px 25px 0;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.section-title{
    font-size:25px;
    font-weight:800;
}

.view-all{
    color:#16a34a;
    font-size:14px;
    font-weight:bold;
}

/* ================= CATEGORIES ================= */

.categories{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:12px;
}

.category{
    background:white;
    border:1px solid #e5e9ec;
    border-radius:12px;
    padding:15px 7px;
    text-align:center;
    transition:.2s;
    cursor:pointer;
}

.category:hover,
.category.selected{
    transform:translateY(-3px);
    border-color:#16a34a;
    box-shadow:0 6px 18px rgba(0,0,0,.07);
}

.category-icon{
    font-size:38px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.category-name{
    font-size:13px;
    font-weight:bold;
}

/* ================= PRODUCTS ================= */

.products{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:18px;
}

.product{
    background:white;
    border:1px solid #e5e9ec;
    border-radius:13px;
    overflow:hidden;
    position:relative;
    transition:.2s;
}

.product:hover{
    transform:translateY(-5px);
    box-shadow:0 12px 28px rgba(0,0,0,.08);
}

.discount{
    position:absolute;
    top:12px;
    right:12px;
    background:#16a34a;
    color:white;
    padding:5px 8px;
    border-radius:5px;
    font-size:11px;
    z-index:2;
}

.favorite{
    position:absolute;
    top:10px;
    left:10px;
    width:35px;
    height:35px;
    border:1px solid #ddd;
    border-radius:50%;
    background:white;
    font-size:19px;
    z-index:2;
}

.favorite.liked{
    color:#16a34a;
}

.product-image{
    height:220px;
    background:#f1f3f4;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.3s;
}

.product:hover img{
    transform:scale(1.05);
}

.product-info{
    padding:16px;
}

.product-name{
    font-size:15px;
    margin-bottom:8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.rating{
    color:#f5a623;
    font-size:13px;
    margin-bottom:10px;
}

.price{
    font-size:19px;
    font-weight:bold;
    color:#102a43;
    margin-bottom:12px;
}

.old-price{
    color:#999;
    text-decoration:line-through;
    font-size:12px;
    margin-right:7px;
}

.add-cart{
    width:100%;
    border:none;
    background:#102a43;
    color:white;
    padding:11px;
    border-radius:7px;
    font-weight:bold;
}
