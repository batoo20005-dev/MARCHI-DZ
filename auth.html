<main class="layout">

 <div class="welcome"><h2 id="title">مرحبًا بك مجددًا 👋</h2><p id="descForm">سجّل دخولك إلى حسابك للمتابعة في التسوق واستكشاف أحدث العروض.</p></div>

  <div class="field hide" id="firstNameWrap"><label for="firstName">الاسم</label><div class="input"><span class="ico">♙</span><input id="firstName" autocomplete="given-name" placeholder="أدخل اسمك"></div></div>
  <div class="field hide" id="lastNameWrap"><label for="lastName">اللقب</label><div class="input"><span class="ico">♙</span><input id="lastName" autocomplete="family-name" placeholder="أدخل لقبك"></div></div>
  <div class="field hide" id="birthWrap"><label>تاريخ الميلاد</label><div class="birth-grid">
    <select id="birthDay" aria-label="اليوم"><option value="">اليوم</option></select>

  </div></div>
  <div class="field hide" id="contactTypeWrap"><label>طريقة التسجيل</label><div class="contact-toggle"><button type="button" class="contact-option active" data-contact="phone">☎ رقم الهاتف</button><button type="button" class="contact-option" data-contact="email">✉ البريد الإلكتروني</button></div></div>
  <div class="field"><label id="emailLabel" for="email">البريد الإلكتروني</label><div class="input"><span class="ico" id="contactIcon">✉</span><input id="email" type="email" autocomplete="email" placeholder="أدخل بريدك الإلكتروني" required></div></div>
  <button type="button" id="sendCode" class="send-code hide">إرسال رمز التحقق　➤</button>
  <div class="field hide" id="codeWrap"><label for="verificationCode">رمز التحقق</label><div class="input"><span class="ico">♧</span><input id="verificationCode" inputmode="numeric" autocomplete="one-time-code" placeholder="أدخل رمز التحقق المرسل إليك"></div><small style="display:block;color:#61738a;margin-top:6px;font-size:12px">أدخل الرمز الذي وصلك عبر وسيلة التسجيل المختارة.</small></div>
  <div class="field" id="passWrap"><label for="password">كلمة المرور</label><div class="input"><span class="ico">♙</span><input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="أدخل كلمة المرور" required><button class="eye" id="eye" type="button" aria-label="إظهار كلمة المرور">◉</button></div></div>

  <button class="primary" id="submit" type="submit">إنشاء الحساب　♙+</button>
 </form>
 <div class="signup" id="signup"><span id="signupPrompt">ليس لديك حساب؟</span><button id="switch" type="button">إنشاء حساب جديد　♙+</button></div>
 <div class="security">🔒　بياناتك محمية وتُعالج بأمان عبر نظام المصادقة.</div>
</div></section>

<script>
/* أضف رابط Supabase وPublishable/anon key. لا تستخدم service_role key في المتصفح. */
const SUPABASE_URL="PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
const SUPABASE_ANON_KEY="PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";
const configured=SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("PASTE_YOUR")&&SUPABASE_ANON_KEY&&!SUPABASE_ANON_KEY.includes("PASTE_YOUR");
const sb=configured&&window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=id=>document.getElementById(id);let mode="signup",contactMethod="phone",pendingContact=null;
function msg(text,ok=false){$("message").textContent=text;$("message").className="msg show "+(ok?"ok":"error")}
function clearMsg(){$("message").className="msg";$("message").textContent=""}
function show(id,yes){$(id).classList.toggle("hide",!yes)}
function fillBirthDates(){
 for(let d=1;d<=31;d++){const o=document.createElement("option");o.value=d;o.textContent=d;$("birthDay").append(o)}
 const thisYear=new Date().getFullYear();for(let y=thisYear-18;y>=thisYear-100;y--){const o=document.createElement("option");o.value=y;o.textContent=y;$("birthYear").append(o)}
}
fillBirthDates();
function setContact(method){contactMethod=method;document.querySelectorAll("[data-contact]").forEach(b=>b.classList.toggle("active",b.dataset.contact===method));$("emailLabel").textContent=method==="phone"?"رقم الهاتف مع رمز الدولة":"البريد الإلكتروني";$("email").type=method==="phone"?"tel":"email";$("email").placeholder=method==="phone"?"+213XXXXXXXXX":"أدخل بريدك الإلكتروني";$("email").autocomplete=method==="phone"?"tel":"email";$("email").value="";clearMsg()}
document.querySelectorAll("[data-contact]").forEach(b=>b.addEventListener("click",()=>setContact(b.dataset.contact)));
document.querySelectorAll("[data-role]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-role]").forEach(x=>x.classList.toggle("active",x===b));$("accountType").value=b.dataset.role;}));
function setMode(next){
 mode=next;clearMsg();
 show("firstNameWrap",mode==="signup");show("lastNameWrap",mode==="signup");show("birthWrap",mode==="signup");show("roleWrap",mode==="signup");show("confirmWrap",mode==="signup");show("contactTypeWrap",mode==="signup");
 show("codeWrap",mode==="verify");show("sendCode",mode==="signup");show("passWrap",mode!=="reset"&&mode!=="verify");show("options",mode==="login");show("signup",mode!=="reset"&&mode!=="verify");
 $("password").required=mode==="login"||mode==="signup";$("confirmPassword").required=mode==="signup";$("firstName").required=mode==="signup";$("lastName").required=mode==="signup";
 $("birthDay").required=mode==="signup";$("birthMonth").required=mode==="signup";$("birthYear").required=mode==="signup";
 $("email").required=mode!=="verify";
 if(mode==="login"){$("title").textContent="مرحبًا بك مجددًا 👋";$("descForm").textContent="سجّل دخولك إلى حسابك للمتابعة في التسوق واستكشاف أحدث العروض.";$("submit").textContent="تسجيل الدخول　↪";$("signupPrompt").textContent="ليس لديك حساب؟";$("switch").textContent="إنشاء حساب جديد　♙+";$("emailLabel").textContent="البريد الإلكتروني أو رقم الهاتف";$("email").type="text";$("email").placeholder="أدخل بريدك الإلكتروني أو رقم هاتفك"}
 else if(mode==="signup"){$("title").textContent="أنشئ حسابك الآن ✨";$("descForm").textContent="أدخل بياناتك واختر طريقة التسجيل ونوع الحساب.";$("submit").textContent="إنشاء الحساب وإرسال الرمز";$("signupPrompt").textContent="لديك حساب بالفعل؟";$("switch").textContent="تسجيل الدخول";setContact(contactMethod)}
 else if(mode==="verify"){$("title").textContent="تأكيد الحساب 🔐";$("descForm").textContent="أدخل رمز التحقق الذي وصلك لإكمال إنشاء حسابك.";$("submit").textContent="تأكيد الرمز وإنشاء الحساب";$("emailLabel").textContent="";$("email").required=false}
 else{$("title").textContent="استعادة كلمة المرور 🔐";$("descForm").textContent="أدخل بريدك الإلكتروني وسنرسل لك رابطًا آمنًا لإعادة تعيين كلمة المرور.";$("submit").textContent="إرسال رابط الاستعادة";$("emailLabel").textContent="البريد الإلكتروني";$("email").type="email";$("email").placeholder="أدخل بريدك الإلكتروني"}
}
$("eye").onclick=()=>{$("password").type=$("password").type==="password"?"text":"password"};
$("switch").onclick=()=>setMode(mode==="login"?"signup":"login");$("forgot").onclick=()=>setMode("reset");
function validContact(contact,method){return method==="phone"?/^\+[1-9]\d{7,14}$/.test(contact):/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)}
function birthDate(){
 const d=Number($("birthDay").value),m=Number($("birthMonth").value),y=Number($("birthYear").value);
 if(!d||!m||!y)return null;const date=new Date(y,m-1,d);if(date.getFullYear()!==y||date.getMonth()!==m-1||date.getDate()!==d)return null;
 return {d,m,y,date};
}
function validateSignup(){
 const first=$("firstName").value.trim(),last=$("lastName").value.trim(),birth=birthDate(),pass=$("password").value;
 if(!first||!last)return "أدخل الاسم واللقب في الخانتين المخصصتين.";
 if(!birth)return "اختر يوم وشهر وسنة ميلاد صحيحة.";
 const today=new Date(),age=today.getFullYear()-birth.y-((today.getMonth()<birth.m-1)||(today.getMonth()===birth.m-1&&today.getDate()<birth.d)?1:0);
 if(age<18)return "يجب أن يكون عمرك 18 سنة أو أكثر لإنشاء حساب.";
 if(!validContact($("email").value.trim(),contactMethod))return contactMethod==="phone"?"أدخل رقم الهاتف مع رمز الدولة، مثال: +213XXXXXXXXX.":"أدخل بريدًا إلكترونيًا صحيحًا.";
 if(pass.length<8)return "كلمة المرور يجب أن تتكون من 8 أحرف على الأقل.";
 if(pass!==$("confirmPassword").value)return "كلمتا المرور غير متطابقتين.";
 return null;
}
async function sendVerification(){
 clearMsg();if(!sb)return msg("يلزم إعداد Supabase أولًا بوضع رابط المشروع وPublishable key في نهاية الملف.");
 const issue=validateSignup();if(issue)return msg(issue);
 const contact=$("email").value.trim();pendingContact=contact;
 const birth=birthDate();const metadata={first_name:$("firstName").value.trim(),last_name:$("lastName").value.trim(),birth_date:`${birth.y}-${String(birth.m).padStart(2,"0")}-${String(birth.d).padStart(2,"0")}`,account_type:$("accountType").value};
 $("sendCode").disabled=true;$("sendCode").textContent="جارٍ إرسال الرمز...";
 try{
  let result;
  if(contactMethod==="phone")result=await sb.auth.signUp({phone:contact,password:$("password").value,options:{data:metadata}});
  else result=await sb.auth.signUp({email:contact,password:$("password").value,options:{data:metadata}});
  if(result.error)throw result.error;
  setMode("verify");msg(contactMethod==="phone"?"تم طلب إرسال رمز SMS إلى رقمك. أدخل الرمز عند وصوله.":"تم إرسال رسالة تأكيد إلى بريدك. إذا كانت إعدادات Supabase تستخدم OTP، أدخل الرمز المرسل.",true);
 }catch(e){msg(e.message||"تعذر إرسال رمز التحقق. تحقق من إعدادات Supabase.")}
 finally{$("sendCode").disabled=false;$("sendCode").textContent="إرسال رمز التحقق"}
}
$("sendCode").onclick=sendVerification;
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();clearMsg();
 const contact=$("email").value.trim(),password=$("password").value;
 if(mode==="signup"){await sendVerification();return}
 if(mode==="verify"){
  const token=$("verificationCode").value.trim();if(!token)return msg("أدخل رمز التحقق.");
  if(!sb||!pendingContact)return msg("تعذر تحديد بيانات التسجيل. ارجع وأنشئ الحساب من جديد.");
  $("submit").disabled=true;
  try{const r=contactMethod==="phone"?await sb.auth.verifyOtp({phone:pendingContact,token,type:"sms"}):await sb.auth.verifyOtp({email:pendingContact,token,type:"email"});if(r.error)throw r.error;msg("تم تأكيد الحساب بنجاح. يمكنك الآن تسجيل الدخول.",true);$("email").value=pendingContact;setMode("login")}
  catch(err){msg(err.message||"رمز التحقق غير صحيح أو انتهت صلاحيته.")}
  finally{$("submit").disabled=false}
  return;
 }
 if(mode==="reset"){
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact))return msg("أدخل بريدًا إلكترونيًا صحيحًا.");
  if(!sb)return msg("أضف إعدادات Supabase أولًا.");
  try{const r=await sb.auth.resetPasswordForEmail(contact,{redirectTo:location.origin+"/auth.html"});if(r.error)throw r.error;msg("إذا كان البريد مسجلًا، فستصلك تعليمات الاستعادة.",true)}catch(err){msg(err.message||"تعذر إرسال رسالة الاستعادة.")}return;
 }
 if(!contact||!password)return msg("أدخل بيانات تسجيل الدخول.");
 if(!sb)return msg("يلزم إعداد Supabase أولًا بوضع رابط المشروع وPublishable key في نهاية الملف.");
 $("submit").disabled=true;
 try{const isPhone=/^\+[1-9]\d{7,14}$/.test(contact);const r=isPhone?await sb.auth.signInWithPassword({phone:contact,password}):await sb.auth.signInWithPassword({email:contact,password});if(r.error)throw r.error;msg("تم تسجيل الدخول بنجاح. جارٍ الانتقال إلى المتجر...",true);location.href="index.html"}
 catch(err){msg(err.message||"تعذر تسجيل الدخول. تحقق من البيانات.")}
 finally{$("submit").disabled=false}
});
setMode("signup");setContact("phone");
</script>
