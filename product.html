<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المنتج | MARCHI DZ</title>

<!-- مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f7f9fa;
    color:#172033;
}

header{
    background:white;
    border-bottom:1px solid #e5e9ec;
}

.top-header{
    max-width:1400px;
    margin:auto;
    min-height:82px;
    padding:10px 25px;
    display:flex;
    align-items:center;
    gap:25px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:#172033;
}

.logo-name{
    font-size:25px;
    font-weight:900;
}

.marchi{ color:#102a43; }
.dz{ color:#16a34a; }

.logo-slogan{
    font-size:11px;
    color:#777;
    margin-top:4px;
}

.search{
    flex:1;
    height:48px;
    display:flex;
    border:1px solid #dfe5e9;
    border-radius:10px;
    overflow:hidden;
}

.search input{
    flex:1;
    border:none;
    outline:none;
    padding:0 18px;
    font-size:15px;
}

.search button{
    width:60px;
    border:none;
    background:#102a43;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.actions{
    display:flex;
    gap:22px;
}

.action{
    font-size:15px;
    cursor:pointer;
    text-decoration:none;
    color:#172033;
    font-weight:bold;
}

/* PRODUCT */

.container{
    max-width:1200px;
    margin:45px auto;
    padding:0 20px;
}

.back{
    display:inline-block;
    margin-bottom:25px;
    color:#16a34a;
    font-weight:bold;
    text-decoration:none;
}

.product-page{
    background:white;
    border-radius:16px;
    padding:30px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:50px;
    box-shadow:0 5px 25px rgba(0,0,0,.05);
}

.product-image{
    height:520px;
    background:#f3f4f5;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.category{
    color:#16a34a;
    font-size:14px;
    font-weight:bold;
    margin-bottom:12px;
}

h1{
    font-size:30px;
    margin-bottom:15px;
    color:#102a43;
}

.store-badge{
    display:inline-block;
    background:#e0f2fe;
    color:#0369a1;
    padding:5px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:15px;
}

.stock-badge{
    display:inline-block;
    padding:5px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:15px;
    margin-right:8px;
}

.stock-in{ background:#dcfce7; color:#15803d; }
.stock-out{ background:#fee2e2; color:#991b1b; }

.description{
    color:#666;
    line-height:1.9;
    margin-bottom:20px;
    white-space:pre-line;
}

.price{
    font-size:32px;
    font-weight:bold;
    color:#102a43;
}

/* خيارات المقاسات والألوان */
.options-group{
    margin:18px 0;
}

.options-group label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    font-size:14px;
    color:#102a43;
}

.options-select{
    width:100%;
    padding:12px;
    border:1px solid #dfe5e9;
    border-radius:8px;
    outline:none;
    font-size:14px;
    background:white;
}

.delivery-options-view{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:20px 0;
}

.del-card{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    padding:12px;
    border-radius:8px;
    font-size:14px;
    text-align:center;
}

.deposit-alert-box{
    display:none;
    background:#fffbeb;
    border:1px solid #fcd34d;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

.deposit-alert-box h4{ color:#92400e; margin-bottom:5px; font-size:15px; }
.rip-box{ background:white; padding:8px; border:1px dashed #d97706; border-radius:6px; font-family:monospace; font-weight:bold; text-align:center; margin-top:5px; color:#b45309; }

.quantity{
    display:flex;
    align-items:center;
    gap:15px;
    margin:20px 0;
}

.quantity button{
    width:38px;
    height:38px;
    border:1px solid #ddd;
    background:white;
    border-radius:7px;
    font-size:20px;
    cursor:pointer;
}

.quantity button:disabled{
    background:#f1f5f9;
    cursor:not-allowed;
    color:#ccc;
}

.quantity span{
    font-size:18px;
    font-weight:bold;
}

.add-cart{
    width:100%;
    padding:16px;
    border:none;
    border-radius:9px;
    background:#16a34a;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.add-cart:hover{
    background:#12813b;
}

.add-cart:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

.info{
    margin-top:25px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.info-box{
    background:#f7f9fa;
    padding:15px;
    border-radius:9px;
    text-align:center;
    font-size:13px;
}

.reviews-container{
    margin-top:40px;
    background:white;
    border-radius:16px;
    padding:30px;
    box-shadow:0 5px 25px rgba(0,0,0,.05);
    display:none;
}

.reviews-container h2{ font-size:20px; margin-bottom:20px; border-bottom:2px solid #f1f5f9; padding-bottom:10px; }
.review-card{ padding:15px 0; border-bottom:1px solid #f1f5f9; }
.review-card:last-child{ border-bottom:none; }
.rev-name{ font-weight:bold; margin-bottom:4px; }
.rev-stars{ color:#f5a623; margin-bottom:6px; }

footer{
    margin-top:70px;
    background:#102a43;
    color:white;
    padding:35px;
    text-align:center;
}

@media(max-width:800px){
    .top-header{ flex-wrap:wrap; }
    .logo{ width:100%; }
    .search{ width:100%; flex:auto; }
    .actions{ display:none; }
    .product-page{ grid-template-columns:1fr; gap:25px; }
    .product-image{ height:350px; }
    h1{ font-size:24px; }
    .info{ grid-template-columns:1fr; }
}

</style>
</head>

<body>

<header>
<div class="top-header">
<a href="index.html" class="logo">
<div>
<div class="logo-name">
<span class="marchi">MARCHI</span>
<span class="dz"> DZ</span>
</div>
<div class="logo-slogan">تسوق بثقة، استلم براحة</div>
</div>
</a>

<div class="search">
<input type="text" id="searchInput" placeholder="ابحث عن أي منتج...">
<button onclick="searchProducts()">🔍</button>
</div>

<div class="actions">
<a href="auth.html" class="action">👤 الحساب</a>
<a href="cart.html" class="action">🛒 السلة</a>
</div>
</div>
</header>

<main class="container">

<a href="index.html" class="back">← العودة إلى المنتجات</a>

<div id="productMainContainer">
    <div style="text-align:center; padding:60px; background:white; border-radius:16px;">
        <h2>جاري تحميل تفاصيل المنتج من قاعدة البيانات... ⏳</h2>
    </div>
</div>

<!-- قسم التقييمات -->
<div class="reviews-container" id="reviewsSection">
    <h2>💬 تقييمات المشترين</h2>
    <div id="reviewsList"></div>
</div>

</main>

<footer>
<strong>MARCHI DZ</strong>
<br><br>
سوق إلكتروني جزائري — تسوق بثقة، استلم براحة 🇩🇿
</footer>

<script>
const supabase = window.supabase.createClient(
    "https://lifxjoofdlcmbuskvsbg.supabase.co",
    "sb_publishable_KwXbluyy6qsqMsdIDag8Pg_5r3nK3pX"
);

let currentProduct = null;
let quantity = 1;
let homePrice = 600;
let deskPrice = 400;

// 🛡️ دالة تطهير النصوص لمنع ثغرات XSS
function escapeHTML(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

async function loadProductDetails() {
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    if (!productId) {
        showError("❌ لم يتم تحديد المنتج المطلوب");
        return;
    }

    const { data: product, error } = await supabase
        .from('products')
        .select('*')
        .eq('id', productId)
        .single();

    if (error || !product) {
        showError("❌ عذراً، المنتج غير موجود أو تم حذفه من المنصة");
        return;
    }

    // 🛡️ التحقق من حالة المنتج ومنع العرض في حال عدم الموافقة أو الرفض
    if (product.status && product.status !== 'published' && product.status !== 'active') {
        showError("⚠️ هذا المنتج قيد المراجعة أو غير متاح للبيع حالياً");
        return;
    }

    currentProduct = product;
    homePrice = product.home_price || 600;
    deskPrice = product.desk_price || 400;

    renderUI(product);
    loadReviews(productId);
}

function showError(message) {
    document.getElementById("productMainContainer").innerHTML = `
        <div style="text-align:center; padding:50px; background:white; border-radius:16px;">
            <h2>${message}</h2>
            <br>
            <a href="index.html" class="back">العودة للتسوق</a>
        </div>
    `;
}

function renderUI(p) {
    const safeName = escapeHTML(p.name);
    const safeDesc = escapeHTML(p.description || "لا يوجد وصف إضافي لهذا المنتج.");
    const safeStore = escapeHTML(p.store_name || "متجر معتمد");
    const safeCategory = escapeHTML(p.category || "إلكترونيات ومنتجات عامة");
    const safeImg = p.image_url ? escapeHTML(p.image_url) : 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1000&q=85';
    
    // 📦 التحقق من حالة المخزون
    const isOutOfStock = (p.stock !== undefined && p.stock !== null) ? (p.stock <= 0) : false;
    const stockBadge = isOutOfStock 
        ? `<span class="stock-badge stock-out">❌ نفد المخزون</span>`
        : `<span class="stock-badge stock-in">✔ متوفر في المخزون (${p.stock ?? 'متوفر'})</span>`;

    document.title = `${safeName} | MARCHI DZ`;

    // 👕 توليد قائمة المقاسات إذا وجدت
    let sizesHTML = "";
    if (p.sizes && p.sizes.length > 0) {
        sizesHTML = `
            <div class="options-group">
                <label>اختر المقاس:</label>
                <select id="selectedSize" class="options-select">
                    ${p.sizes.map(s => `<option value="${escapeHTML(s)}">${escapeHTML(s)}</option>`).join('')}
                </select>
            </div>
        `;
    }

    // 🎨 توليد قائمة الألوان إذا وجدت
    let colorsHTML = "";
    if (p.colors && p.colors.length > 0) {
        colorsHTML = `
            <div class="options-group">
                <label>اختر اللون:</label>
                <select id="selectedColor" class="options-select">
                    ${p.colors.map(c => `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('')}
                </select>
            </div>
        `;
    }

    let depositHTML = "";
    if (p.require_deposit) {
        depositHTML = `
            <div class="deposit-alert-box" style="display:block;">
                <h4>⚠️ تنبيه: مطلوب عربون تسقاع لحجز الطلب</h4>
                <p style="font-size:12px; color:#78350f;">يشترط التاجر تحويل مبلغ تسقاع عبر BaridiMob لضمان الجدية.</p>
                <div class="rip-box">RIP: ${escapeHTML(p.rip_number || 'غير متوفر')}</div>
            </div>
        `;
    }

    document.getElementById("productMainContainer").innerHTML = `
        <div class="product-page">
            <div class="product-image">
                <img src="${safeImg}" alt="${safeName}">
            </div>

            <div>
                <div class="category">${safeCategory}</div>
                <div style="display:flex; align-items:center; flex-wrap:wrap;">
                    <div class="store-badge">🏪 متجر: ${safeStore}</div>
                    ${stockBadge}
                </div>
                <h1>${safeName}</h1>

                <div class="rating">
                    ★★★★★ <span style="color:#777; font-size:13px;">(منتج موثوق)</span>
                </div>

                <p class="description">${safeDesc}</p>

                <div>
                    <span class="price">${Number(p.price).toLocaleString()} دج</span>
                </div>

                ${sizesHTML}
                ${colorsHTML}

                <div class="delivery-options-view">
                    <div class="del-card">🏠 توصيل للمنزل<br><strong>${homePrice.toLocaleString()} دج</strong></div>
                    <div class="del-card">🏢 توصيل للمكتب (Stop Desk)<br><strong>${deskPrice.toLocaleString()} دج</strong></div>
                </div>

                ${depositHTML}

                <div class="quantity">
                    <strong>الكمية:</strong>
                    <button onclick="decreaseQuantity()" ${isOutOfStock ? 'disabled' : ''}>−</button>
                    <span id="quantity">1</span>
                    <button onclick="increaseQuantity()" ${isOutOfStock ? 'disabled' : ''}>+</button>
                </div>

                <button class="add-cart" id="addCartBtn" onclick="addToCart()" ${isOutOfStock ? 'disabled' : ''}>
                    ${isOutOfStock ? '❌ غير متوفر حالياً' : '🛒 أضف إلى السلة'}
                </button>

                <div class="info">
                    <div class="info-box">🚚<br>توصيل سريع 58 ولاية</div>
                    <div class="info-box">💳<br>الدفع عند الاستلام</div>
                    <div class="info-box">🛡️<br>حماية المشتري</div>
                </div>
            </div>
        </div>
    `;
}

async function loadReviews(productId) {
    const { data: reviews } = await supabase
        .from('product_reviews')
        .select('*')
        .eq('product_id', productId)
        .order('created_at', { ascending: false });

    if (reviews && reviews.length > 0) {
        document.getElementById("reviewsSection").style.display = "block";
        const listContainer = document.getElementById("reviewsList");
        let html = "";
        reviews.forEach(r => {
            const stars = "⭐".repeat(r.rating || 5);
            html += `
                <div class="review-card">
                    <div class="rev-name">${escapeHTML(r.reviewer_name)}</div>
                    <div class="rev-stars">${stars}</div>
                    <p style="color:#666; font-size:14px;">${escapeHTML(r.comment || '')}</p>
                </div>
            `;
        });
        listContainer.innerHTML = html;
    }
}

function increaseQuantity(){
    if (!currentProduct) return;
    if (currentProduct.stock !== undefined && currentProduct.stock !== null && quantity >= currentProduct.stock) {
        alert(`عذراً، أقصى كمية متوفرة في المخزون هي ${currentProduct.stock}`);
        return;
    }
    quantity++;
    document.getElementById("quantity").textContent = quantity;
}

function decreaseQuantity(){
    if(quantity > 1){
        quantity--;
        document.getElementById("quantity").textContent = quantity;
    }
}

function addToCart(){
    if (!currentProduct) return;

    if (currentProduct.stock !== undefined && currentProduct.stock !== null && currentProduct.stock <= 0) {
        alert("عذراً، هذا المنتج نفد من المخزون ولا يمكن إضافته للسلة.");
        return;
    }

    // جلب المقاس واللون المختارين من الزبون
    const selectedSize = document.getElementById("selectedSize")?.value || null;
    const selectedColor = document.getElementById("selectedColor")?.value || null;

    let cart = JSON.parse(localStorage.getItem("marchiCart")) || [];
    
    // التحقق من وجود نفس المنتج بنفس المقاس واللون مسبقاً في السلة
    const existingIndex = cart.findIndex(item => 
        item.id === currentProduct.id && 
        item.selectedSize === selectedSize && 
        item.selectedColor === selectedColor
    );

    if (existingIndex > -1) {
        const totalReq = cart[existingIndex].quantity + quantity;
        if (currentProduct.stock !== undefined && currentProduct.stock !== null && totalReq > currentProduct.stock) {
            alert(`لا يمكنك إضافة المزيد. الكمية المطلوبة تتجاوز المخزون المتاح (${currentProduct.stock}).`);
            return;
        }
        cart[existingIndex].quantity = totalReq;
    } else {
        cart.push({
            id: currentProduct.id,
            name: currentProduct.name,
            price: currentProduct.price,
            image: currentProduct.image_url,
            seller_id: currentProduct.seller_id,
            home_price: currentProduct.home_price,
            desk_price: currentProduct.desk_price,
            require_deposit: currentProduct.require_deposit,
            rip_number: currentProduct.rip_number,
            selectedSize: selectedSize,
            selectedColor: selectedColor,
            quantity: quantity
        });
    }

    localStorage.setItem("marchiCart", JSON.stringify(cart));
    alert("🎉 تمت إضافة المنتج إلى السلة بنجاح!");
    window.location.href = "cart.html";
}

function searchProducts() {
    const query = document.getElementById("searchInput").value.trim();
    if (query) {
        window.location.href = `index.html?search=${encodeURIComponent(query)}`;
    }
}

// تشغيل جلب بيانات المنتج عند فتح الصفحة
loadProductDetails();
</script>

</body>
</html>
