<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة المنصة | MARCHI DZ Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{ margin:0; padding:0; box-sizing:border-box; }
body{ font-family:Arial, sans-serif; background:#0f172a; color:white; padding:20px; }
header{ background:#1e293b; padding:20px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; border:1px solid #334155; }
.logo{ font-size:24px; font-weight:900; }
.dz{ color:#16a34a; }
.stats-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:15px; margin-bottom:25px; }
.stat-card{ background:#1e293b; padding:20px; border-radius:12px; border:1px solid #334155; text-align:center; }
.stat-card h3{ font-size:13px; color:#94a3b8; margin-bottom:8px; }
.stat-card .val{ font-size:26px; font-weight:bold; color:#4ade80; }
.table-box{ background:#1e293b; padding:20px; border-radius:12px; border:1px solid #334155; margin-bottom:25px; }
h2{ font-size:18px; margin-bottom:15px; color:#f8fafc; }
table{ width:100%; border-collapse:collapse; text-align:right; font-size:14px; }
th, td{ padding:12px; border-bottom:1px solid #334155; }
th{ color:#94a3b8; background:#0f172a; }
.btn-action{ padding:6px 12px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px; margin-left:5px; }
.btn-green{ background:#16a34a; color:white; }
.btn-blue{ background:#0284c7; color:white; }
.btn-purple{ background:#8b5cf6; color:white; }
.btn-red{ background:#dc2626; color:white; }
.role-badge{ padding:3px 8px; border-radius:4px; font-size:11px; font-weight:bold; }
.role-admin{ background:#ef4444; color:white; }
.role-mod{ background:#0284c7; color:white; }
.role-seller{ background:#16a34a; color:white; }
.role-buyer{ background:#64748b; color:white; }
@media(max-width:768px){ .stats-grid{ grid-template-columns:1fr 1fr; } table{ font-size:12px; } }
</style>
</head>
<body>

<header>
<div class="logo">MARCHI<span class="dz"> DZ</span> | 👑 لوحة المدير العام</div>
<div>
    <a href="moderator.html" style="color:#38bdf8; text-decoration:none; font-weight:bold; margin-left:15px;">🛡️ لوحة الإشراف</a>
    <a href="index.html" style="color:#4ade80; text-decoration:none; font-weight:bold; margin-left:15px;">🏪 المتجر</a>
    <button onclick="logoutAdmin()" style="background:#dc2626; color:white; border:none; padding:8px 15px; border-radius:6px; font-weight:bold; cursor:pointer;">خروج</button>
</div>
</header>

<main>
    <div class="stats-grid">
        <div class="stat-card">
            <h3>👥 إجمالي المستخدمين</h3>
            <div class="val" id="totalUsers">0</div>
        </div>
        <div class="stat-card">
            <h3>🛡️ عدد المشرفين</h3>
            <div class="val" id="totalMods" style="color:#38bdf8;">0</div>
        </div>
        <div class="stat-card">
            <h3>🏪 المتاجر المسجلة</h3>
            <div class="val" id="totalSellers">0</div>
        </div>
        <div class="stat-card">
            <h3>💳 ديون التجار للمنصة</h3>
            <div class="val" id="totalDebts" style="color:#ef4444;">0 دج</div>
        </div>
    </div>

    <!-- جدول إدارة جميع المستخدمين وتغيير رتبهم -->
    <div class="table-box">
        <h2>👥 إدارة المستخدمين والأدوار (التعيين كمشرف / تاجر / مشتري)</h2>
        <table>
            <thead>
                <tr>
                    <th>الاسم الكامل</th>
                    <th>الهاتف</th>
                    <th>الرتبة الحالية</th>
                    <th>الديون (للتجار)</th>
                    <th>الإجراءات والترقية</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <tr><td colspan="5" style="text-align:center;">جاري التحميل...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script>
const supabase = window.supabase.createClient(
    "https://lifxjoofdlcmbuskvsbg.supabase.co",
    "sb_publishable_KwXbluyy6qsqMsdIDag8Pg_5r3nK3pX"
);

const currentUser = JSON.parse(localStorage.getItem("marchi_user"));

if (!currentUser || currentUser.role !== 'admin') {
    alert("⚠️ هذه اللوحة مخصصة لمدير المنصة فقط!");
    window.location.href = "index.html";
}

async function loadAdminData() {
    try {
        const { data: users } = await supabase.from('users').select('*').order('created_at', { ascending: false });

        if (users) {
            document.getElementById("totalUsers").textContent = users.length;
            
            const mods = users.filter(u => u.role === 'moderator');
            const sellers = users.filter(u => u.role === 'seller');
            
            document.getElementById("totalMods").textContent = mods.length;
            document.getElementById("totalSellers").textContent = sellers.length;

            let sumDebt = sellers.reduce((acc, s) => acc + (s.debt || 0), 0);
            document.getElementById("totalDebts").textContent = sumDebt.toLocaleString() + " دج";

            const tbody = document.getElementById("usersTableBody");
            tbody.innerHTML = "";

            users.forEach(u => {
                let roleBadge = `<span class="role-badge role-buyer">👤 مشتري</span>`;
                if(u.role === 'admin') roleBadge = `<span class="role-badge role-admin">👑 مدير</span>`;
                if(u.role === 'moderator') roleBadge = `<span class="role-badge role-mod">🛡️ مشرف</span>`;
                if(u.role === 'seller') roleBadge = `<span class="role-badge role-seller">🏪 تاجر</span>`;

                tbody.innerHTML += `
                    <tr>
                        <td><strong>${u.full_name}</strong></td>
                        <td>${u.phone}</td>
                        <td>${roleBadge}</td>
                        <td style="color:${(u.debt || 0) >= 500 ? '#ef4444' : '#4ade80'}; font-weight:bold;">${u.role === 'seller' ? (u.debt || 0) + ' دج' : '-'}</td>
                        <td>
                            ${u.role !== 'admin' ? `
                                <button class="btn-action btn-blue" onclick="changeRole(${u.id}, 'moderator')">🛡️ ترقية لمشرف</button>
                                <button class="btn-action btn-purple" onclick="changeRole(${u.id}, 'seller')">🏪 تحويل لتاجر</button>
                                <button class="btn-action btn-green" onclick="changeRole(${u.id}, 'buyer')">👤 تحويل لمشتري</button>
                                ${u.role === 'seller' ? `<button class="btn-action btn-red" onclick="resetSellerDebt(${u.id})">⚡ تصفير الدين</button>` : ''}
                            ` : '<span style="color:#94a3b8; font-size:12px;">حساب المدير العام</span>'}
                        </td>
                    </tr>
                `;
            });
        }

    } catch (err) {
        console.error("Admin Load Error:", err);
    }
}

// دالة تغيير الرتبة بضغطة زر واحدة
async function changeRole(userId, newRole) {
    const roleNames = {
        'moderator': 'مشرف (خدمة عملاء)',
        'seller': 'تاجر / بائع',
        'buyer': 'مشتري / زبون'
    };

    if (confirm(`هل أنت تأكد من تغيير رتبة هذا المستخدم إلى [${roleNames[newRole]}]؟`)) {
        const { error } = await supabase.from('users').update({ role: newRole }).eq('id', userId);
        if (error) {
            alert("❌ حدث خطأ أثناء التحديث: " + error.message);
        } else {
            alert("🎉 تم تغيير رتبة المستخدم بنجاح!");
            loadAdminData();
        }
    }
}

async function resetSellerDebt(sellerId) {
    if (confirm("هل تريد تصفير ديون هذا التاجر فورياً؟")) {
        await supabase.from('users').update({ debt: 0 }).eq('id', sellerId);
        alert("✅ تم تصفير الدين بنجاح.");
        loadAdminData();
    }
}

function logoutAdmin() {
    localStorage.removeItem("marchi_user");
    window.location.href = "index.html";
}

loadAdminData();
</script>
</body>
</html>
